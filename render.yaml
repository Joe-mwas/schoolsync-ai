# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the web service plus a persistent disk for the JSON datastore.
services:
  - type: web
    name: schoolsync-ai
    runtime: node
    # Closest Render region to East Africa; it can't be changed after the service is created
    region: frankfurt
    plan: starter # persistent disks need a paid instance
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    disk:
      name: schoolsync-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/db.json
      - key: SESSION_SECRET
        generateValue: true
      # Turns local numbers like 0712 345 678 into +254712345678; change for other countries
      - key: DEFAULT_COUNTRY_CODE
        value: "254"
      # Shown in the director's brief and at the end of WhatsApp announcements
      - key: SCHOOL_NAME
        sync: false
      # Administrator (system owner) account created on first start
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Encrypts the data file and every backup. Generate it on the Setup page and keep a safe copy:
      # a new server needs the same key to open the data and backups.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Daily encrypted copy outside Render (Cloudflare R2, Backblaze B2 or Amazon S3)
      - key: OFFSITE_BACKUP_ENDPOINT
        sync: false
      - key: OFFSITE_BACKUP_BUCKET
        sync: false
      - key: OFFSITE_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: OFFSITE_BACKUP_SECRET_ACCESS_KEY
        sync: false
      # Optional integrations (leave blank to skip)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
